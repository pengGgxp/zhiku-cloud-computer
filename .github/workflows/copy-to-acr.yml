name: copy-existing-image-to-acr
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: copy-existing-image-to-acr
  cancel-in-progress: false
jobs:
  copy:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SOURCE: ghcr.io/pengggxp/zhiku-cloud-computer@sha256:73af216889e100745d6637e98f786a1bfe6f8010328509b3f29d0eab48b5d1b6
      TARGET: crpi-wt6olxrbvra8q3wg.cn-hangzhou.personal.cr.aliyuncs.com/str1ct/zhiku-cloud-computer
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
    steps:
      - name: Install registry copy client
        run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Copy immutable image without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ACR_USERNAME"
          test -n "$ACR_PASSWORD"
          authfile="$RUNNER_TEMP/acr-auth.json"
          trap 'rm -f "$authfile"' EXIT
          printf '%s' "$ACR_PASSWORD" | skopeo login --authfile "$authfile" --username "$ACR_USERNAME" --password-stdin "${TARGET%%/*}"
          skopeo inspect --raw "docker://$SOURCE" > source-manifest.json
          test "$(jq -r .mediaType source-manifest.json)" = application/vnd.docker.distribution.manifest.v2+json
          skopeo copy --preserve-digests --authfile "$authfile" "docker://$SOURCE" "docker://$TARGET:allinone-e8d9d3e"
          skopeo inspect --authfile "$authfile" --raw "docker://$TARGET:allinone-e8d9d3e" > target-manifest.json
          cmp source-manifest.json target-manifest.json
          skopeo inspect --authfile "$authfile" "docker://$TARGET:allinone-e8d9d3e" > target-info.json
          test "$(jq -r .Architecture target-info.json)" = amd64
          test "$(jq -r .Os target-info.json)" = linux
          skopeo copy --preserve-digests --authfile "$authfile" "docker://$TARGET:allinone-e8d9d3e" "docker://$TARGET:latest"
          echo "Copied immutable image; source and target Docker schema2 manifests match." >> "$GITHUB_STEP_SUMMARY"
          jq '{Name,Digest,Architecture,Os}' target-info.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: acr-copy-verification
          path: |
            source-manifest.json
            target-manifest.json
            target-info.json
