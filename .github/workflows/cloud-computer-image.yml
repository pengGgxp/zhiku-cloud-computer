name: cloud-computer-image
on:
  push:
    paths:
      - Dockerfile
      - .github/workflows/cloud-computer-image.yml
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/zhiku-cloud-computer" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          provenance: false
          sbom: false
          outputs: type=registry,oci-mediatypes=false
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
      - name: Verify registry manifest and installed tools
        shell: bash
        run: |
          set -euo pipefail
          ref="$IMAGE:sha-$GITHUB_SHA"
          docker manifest inspect "$ref" > manifest.json
          test "$(jq -r .mediaType manifest.json)" = application/vnd.docker.distribution.manifest.v2+json
          docker pull "$ref"
          test "$(docker image inspect "$ref" --format '{{.Architecture}}')" = amd64
          docker run --rm --entrypoint bash "$ref" -ec '
            test -x /sbin/init
            for package in systemd openssh-server sudo chrony fuse3 iptables; do dpkg -s "$package" | grep -q "Status: install ok installed"; done
            python -c "import sys, PIL, docx, pypdf, openpyxl, reportlab; assert sys.version_info[:2] == (3, 12)"
            node --version
            npm --version
            libreoffice --version
            pdftoppm -v
            fc-match :lang=zh
          '
          docker image inspect "$ref" --format '{{json .RepoDigests}} {{.Size}}' | tee image-result.txt
          cat image-result.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-computer-image-verification
          path: |
            manifest.json
            image-result.txt
