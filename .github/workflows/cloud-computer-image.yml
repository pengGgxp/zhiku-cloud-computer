name: cloud-computer-image
on:
  push:
    paths:
      - Dockerfile
      - .github/workflows/cloud-computer-image.yml
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/zhiku-cloud-computer" >> "$GITHUB_ENV"
      - name: Inspect base runtime user
        shell: bash
        run: |
          set -euo pipefail
          base=fc-e2b-registry.cn-hangzhou.cr.aliyuncs.com/runtime-v2/all-in-one:v0.1.5
          docker pull "$base"
          user=$(docker image inspect "$base" --format '{{.Config.User}}')
          test -n "$user"
          echo "BASE_USER=$user" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: BASE_USER=${{ env.BASE_USER }}
          platforms: linux/amd64
          provenance: false
          sbom: false
          outputs: type=registry,oci-mediatypes=false
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
      - name: Verify registry manifest and installed tools
        shell: bash
        run: |
          set -euo pipefail
          ref="$IMAGE:sha-$GITHUB_SHA"
          docker manifest inspect "$ref" > manifest.json
          test "$(jq -r .mediaType manifest.json)" = application/vnd.docker.distribution.manifest.v2+json
          docker pull "$ref"
          test "$(docker image inspect "$ref" --format '{{.Architecture}}')" = amd64
          docker run --rm --entrypoint bash "$ref" -ec '
            test -x /sbin/init || test -x /usr/bin/tini
            id user
            python3 -c "import sys, PIL, docx, pypdf, openpyxl, reportlab; print(sys.version); assert sys.version_info >= (3, 10)"
            node --version
            npm --version
            libreoffice --version
            pdftoppm -v
            fc-match :lang=zh
          '
          docker pull fc-e2b-registry.cn-hangzhou.cr.aliyuncs.com/runtime-v2/all-in-one:v0.1.5
          base=fc-e2b-registry.cn-hangzhou.cr.aliyuncs.com/runtime-v2/all-in-one:v0.1.5
          for field in Entrypoint Cmd; do
            test "$(docker image inspect "$base" --format "{{json .Config.$field}}")" = "$(docker image inspect "$ref" --format "{{json .Config.$field}}")"
          done
          docker image inspect "$ref" --format '{{json .Config.User}}' | tee inherited-user.txt
          test "$(docker image inspect "$base" --format '{{json .Config.User}}')" = "$(docker image inspect "$ref" --format '{{json .Config.User}}')"
          docker image inspect "$ref" --format '{{json .RepoDigests}} {{.Size}}' | tee image-result.txt
          cat image-result.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-computer-image-verification
          path: |
            manifest.json
            image-result.txt
            inherited-user.txt
